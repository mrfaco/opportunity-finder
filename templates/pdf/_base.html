{# Shared print-only base for PDF templates. #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ doc_title|default:"Document" }}</title>
  <style>
    @page {
      size: A4;
      margin: 18mm 16mm 22mm 16mm;
      @bottom-right {
        content: "Page " counter(page) " / " counter(pages);
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 9pt;
        color: #475569;
      }
    }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #0f172a;
      font-size: 10.5pt;
      line-height: 1.45;
    }
    h1 { font-size: 18pt; margin: 0 0 4pt 0; }
    h2 { font-size: 13pt; margin: 18pt 0 6pt 0; color: #1e293b; border-bottom: 1pt solid #cbd5e1; padding-bottom: 2pt; }
    h3 { font-size: 11pt; margin: 12pt 0 4pt 0; color: #334155; }
    p  { margin: 0 0 6pt 0; }
    ul, ol { margin: 0 0 6pt 18pt; padding: 0; }
    li { margin: 0 0 2pt 0; }
    .meta {
      font-size: 9pt;
      color: #475569;
      margin: 0 0 12pt 0;
    }
    .meta dt {
      float: left;
      width: 110pt;
      font-weight: 600;
      color: #334155;
    }
    .meta dd {
      margin: 0 0 2pt 110pt;
    }
    .pill {
      display: inline-block;
      padding: 1pt 6pt;
      border-radius: 8pt;
      font-size: 8.5pt;
      background: #e2e8f0;
      color: #1e293b;
    }
    .empty { color: #94a3b8; font-style: italic; }
    a { color: #1d4ed8; text-decoration: none; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 8pt; }
    th, td { text-align: left; padding: 4pt 6pt; border-bottom: 0.5pt solid #cbd5e1; vertical-align: top; }
    th { background: #f1f5f9; font-size: 9pt; text-transform: uppercase; letter-spacing: 0.04em; color: #334155; }
    .url { font-size: 8.5pt; word-break: break-all; color: #475569; }
    .concept {
      page-break-inside: avoid;
      margin: 0 0 14pt 0;
      padding: 10pt 12pt;
      border: 0.5pt solid #cbd5e1;
      border-radius: 4pt;
      background: #f8fafc;
    }
    .concept h3 { margin-top: 0; }
    .footer-note {
      font-size: 8.5pt;
      color: #64748b;
      margin-top: 18pt;
      padding-top: 6pt;
      border-top: 0.5pt solid #cbd5e1;
    }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
