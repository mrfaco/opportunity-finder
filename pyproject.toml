[project]
name = "opportunity-finder"
version = "0.1.0"
description = "Pain-mining opportunity agent: ingest public discussions, cluster complaints, investigate with an LLM agent, produce structured opportunity briefs."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "django>=5.1,<6.0",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "celery>=5.4",
    "django-celery-beat>=2.6",
    "pydantic>=2.7",
    "anthropic>=0.39",
    "voyageai>=0.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "markdown>=3.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "types-PyYAML>=6.0",
    "types-redis>=4.6",
    "types-Markdown>=3.6",
]

[tool.coverage.run]
source = ["core", "clusters", "ingestion", "agents", "investigations", "notifications"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
# Pragmatic baseline: catch real bugs without drowning in django-magic
# false positives. Tighten as the code firms up (target: --strict).
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
namespace_packages = true
mypy_path = "."
exclude = '(migrations/|tests/|scripts/)'
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
# Loosen for the v1 stubs — TODO bodies have intentionally-unspecific
# return types. Re-enable as implementations land.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "environ.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "core",
    "clusters",
    "ingestion",
    "agents",
    "investigations",
    "notifications",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
# Pre-push hook runs `pytest --cov` against this threshold. Bump the number
# (never down) as more code lands. See AGENTS.md for the ratchet rule.
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# See AGENTS.md for the exception-discipline rationale.
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except — bans bare `except:` and `except Exception:`
    "S110",   # try-except-pass (silent swallowing)
    "S112",   # try-except-continue (silent swallowing)
    "TRY002", # avoid raising generic Exception
    "TRY201", # use `raise` (re-raise) without renaming the exception
    "TRY301", # don't `raise` inside the try-block
    "TRY400", # use `logging.exception` instead of `logging.error` in except
    "G",      # flake8-logging-format
    "RET504", # unnecessary assignment before return
    "PLC0415", # imports must be module-level (deferred imports need `# noqa`)
    "TID252", # no relative imports — use the absolute package path
]
# A handful of legitimate suppressions we accept as explicit `# noqa: BLE001`.
# Treat blanket exceptions in the agent loop's outer safety net as the only
# location where catching `Exception` is intentional (it records the failure
# as a structured event then re-raises termination). Everything else: fail.

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use broad excepts to assert on error paths, and local
# imports inside test functions are a normal, harmless pattern.
"tests/**/*.py" = ["BLE001", "S101", "PLC0415"]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only — `from agents.models import X`, never `from .models`.
ban-relative-imports = "all"
